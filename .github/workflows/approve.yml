name: Move Space — tasdiqni tekshirish

# Telegram'dagi ✅ / ✏️ / ❌ tugmalarini o'qiydi va bajaradi.
# Har 5 daqiqada ishlaydi (GitHub ruxsat beradigan eng qisqa oraliq),
# ya'ni ✅ bosgandan keyin post 5 daqiqagacha kutishi mumkin.
#
# Tezroq javob kerak bo'lsa, o'z kompyuteringizda ishlating:
#     python -m scheduler.approval_bot        (Ctrl+C bilan to'xtaydi, darhol javob beradi)
#
# Minut sarfi: ochiq (public) repozitoriyda GitHub Actions bepul va cheksiz.
# Yopiq repozitoriyda oyiga 2000 daqiqa bor — bu jadval uni deyarli to'ldiradi,
# shuning uchun yopiq repo bo'lsa cron'ni "*/30" ga o'zgartiring.
# Ochiq repoda esa cheklov yo'q.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: movespace-state
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tugma bosilishini tekshirish
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ secrets.GEMINI_TEXT_MODEL || 'gemini-3.5-flash' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-4-5
          SEARCH_PROVIDER: tavily
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          IMAGE_PROVIDER: none
          TTS_PROVIDER: none
          TIMEZONE: Asia/Tashkent
          APPROVE_DELAY_NOTE: "5 daq."
        run: python -m scheduler.approval_bot --once

      - name: Holatni saqlash
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "movespace-bot"
          git config user.email "actions@github.com"
          git add -f data/state.db 2>/dev/null || exit 0
          git diff --staged --quiet && exit 0
          git commit -m "state: approval [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}" || true
